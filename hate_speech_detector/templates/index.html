<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hate Speech Detector</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h2 class="text-center mb-0">Hate Speech Detector</h2>
            </div>
            <div class="card-body">
              <form id="analyzeForm">
                <div class="mb-3">
                  <label for="textInput" class="form-label"
                    >Enter text to analyze:</label
                  >
                  <textarea
                    class="form-control"
                    id="textInput"
                    rows="4"
                    required
                  ></textarea>
                </div>
                <div class="text-center">
                  <button type="submit" class="btn btn-primary" id="analyzeBtn">
                    Analyze Text
                  </button>
                </div>
              </form>

              <div id="result" class="mt-4" style="display: none">
                <h4 class="text-center mb-3">Analysis Result</h4>
                <div class="alert" role="alert" id="resultAlert">
                  <p class="mb-1">
                    <strong>Classification:</strong>
                    <span id="classification"></span>
                  </p>
                  <p class="mb-0">
                    <strong>Confidence:</strong> <span id="confidence"></span>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
